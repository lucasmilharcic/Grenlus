services:
  postgres:
    image: postgres:17
    container_name: grenlus-postgres

    environment:
      POSTGRES_DB: grenlus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grenlus"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: grenlus-backend

    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      # =========================================================
      # DATABASE
      # =========================================================

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grenlus
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}


      # =========================================================
      # MERCADO PAGO
      # =========================================================

      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}


      # =========================================================
      # TRANSFERENCIA
      # =========================================================

      TRANSFERENCIA_ALIAS: ${TRANSFERENCIA_ALIAS}
      TRANSFERENCIA_CBU: ${TRANSFERENCIA_CBU}
      TRANSFERENCIA_TITULAR: ${TRANSFERENCIA_TITULAR}


      # =========================================================
      # BACKEND PUBLIC URL
      # =========================================================

      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}




    volumes:
      - uploads_data:/app/uploads


volumes:
  postgres_data:
  uploads_data: