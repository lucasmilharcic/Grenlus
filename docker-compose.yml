services:
  postgres:
    image: postgres:17
    container_name: grenlus-postgres

    environment:
      POSTGRES_DB: grenlus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: grenlus-backend

    ports:
      - "8081:8080"

    depends_on:
      - postgres

    environment:

      # =========================================================
      # DATABASE
      # =========================================================

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/grenlus
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres


      # =========================================================
      # MERCADO PAGO
      # =========================================================

      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}


      # =========================================================
      # TRANSFERENCIA
      # =========================================================

      TRANSFERENCIA_ALIAS: ${TRANSFERENCIA_ALIAS}
      TRANSFERENCIA_CBU: ${TRANSFERENCIA_CBU}
      TRANSFERENCIA_TITULAR: ${TRANSFERENCIA_TITULAR}


      # =========================================================
      # BACKEND PUBLIC URL
      # =========================================================

      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}


      # =========================================================
      # ZIPNOVA
      #
      # Lo mantenemos mientras hacemos la migración
      # hacia Correo Argentino.
      # =========================================================

      ZIPNOVA_API_KEY: ${ZIPNOVA_API_KEY}
      ZIPNOVA_API_SECRET: ${ZIPNOVA_API_SECRET}
      ZIPNOVA_ACCOUNT_ID: ${ZIPNOVA_ACCOUNT_ID}
      ZIPNOVA_ORIGIN_ID: ${ZIPNOVA_ORIGIN_ID}


      # =========================================================
      # CORREO ARGENTINO - PAQ.AR
      # =========================================================

      CORREO_ARGENTINO_API_URL: ${CORREO_ARGENTINO_API_URL}
      CORREO_ARGENTINO_API_KEY: ${CORREO_ARGENTINO_API_KEY}
      CORREO_ARGENTINO_AGREEMENT: ${CORREO_ARGENTINO_AGREEMENT}


    volumes:
      - uploads_data:/app/uploads


volumes:
  postgres_data:
  uploads_data: