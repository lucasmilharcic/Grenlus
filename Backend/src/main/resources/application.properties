spring.application.name=backend


# =========================================================
# DATABASE
# =========================================================

# Local:
# jdbc:postgresql://localhost:5432/grenlus
#
# Docker:
# jdbc:postgresql://postgres:5432/grenlus

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grenlus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:GrenlusSuperSecretKeyForDevelopment123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ987654321abcdef}
jwt.expiration=3600000


# =========================================================
# FRONTEND
# =========================================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# =========================================================
# BACKEND PUBLIC URL
#
# En desarrollo local queda vacío.
#
# En producción:
# BACKEND_PUBLIC_URL=https://api.tudominio.com
# =========================================================

app.backend-public-url=${BACKEND_PUBLIC_URL:}


# =========================================================
# MERCADO PAGO
#
# El token real viene desde:
#
# .env
#   ↓
# Docker
#   ↓
# variable de entorno
#   ↓
# Spring Boot
# =========================================================

mercadopago.access-token=${MP_ACCESS_TOKEN:}


# =========================================================
# TRANSFERENCIA
# =========================================================

transferencia.alias=${TRANSFERENCIA_ALIAS:}
transferencia.cbu=${TRANSFERENCIA_CBU:}
transferencia.titular=${TRANSFERENCIA_TITULAR:GRENLUS}


# =========================================================
# ARCHIVOS
# =========================================================

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================
# ZIPNOVA
#
# Lo mantenemos temporalmente mientras hacemos
# la migración hacia Correo Argentino PAQ.AR.
#
# Las credenciales reales NO se guardan acá.
# =========================================================

zipnova.api-url=${ZIPNOVA_API_URL:https://api.zipnova.com.ar/v2}

zipnova.api-key=${ZIPNOVA_API_KEY:}

zipnova.api-secret=${ZIPNOVA_API_SECRET:}

zipnova.account-id=${ZIPNOVA_ACCOUNT_ID:0}

zipnova.origin-id=${ZIPNOVA_ORIGIN_ID:0}


# =========================================================
# CORREO ARGENTINO - PAQ.AR 2.0
#
# TEST:
# https://apitest.correoargentino.com.ar/paqar
#
# Las credenciales reales vienen desde:
#
# .env
#   ↓
# docker-compose.yml
#   ↓
# variables de entorno
#   ↓
# Spring Boot
#
# NO guardar credenciales reales acá.
# =========================================================

correo-argentino.api-url=${CORREO_ARGENTINO_API_URL:https://apitest.correoargentino.com.ar/paqar}
correo-argentino.api-key=${CORREO_ARGENTINO_API_KEY:}
correo-argentino.agreement=${CORREO_ARGENTINO_AGREEMENT:}