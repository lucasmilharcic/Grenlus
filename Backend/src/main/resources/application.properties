spring.application.name=backend
server.port=${PORT:8080}


# =========================================================
# DATABASE
# =========================================================

# Local:
# jdbc:postgresql://localhost:5432/grenlus
#
# Docker:
# jdbc:postgresql://postgres:5432/grenlus

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grenlus}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:}
jwt.expiration=3600000


# =========================================================
# FRONTEND
# =========================================================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}
# Mercado Pago requires a public URL for automatic return after checkout.
# Use FRONTEND_URL with an HTTPS tunnel/domain outside local development.


# =========================================================
# BACKEND PUBLIC URL
#
# En desarrollo local queda vacío.
#
# En producción:
# BACKEND_PUBLIC_URL=https://api.tudominio.com
# =========================================================

app.backend-public-url=${BACKEND_PUBLIC_URL:}

# =========================================================
# PORTAL MI CORREO
#
# MiCorreo se opera desde su portal web. La URL se sirve al
# panel administrativo, sin exponer credenciales al frontend.
# =========================================================

correo-argentino.portal-url=${CORREO_ARGENTINO_PORTAL_URL:https://micorreo.correoargentino.com.ar/landing}


# =========================================================
# MERCADO PAGO
#
# El token real viene desde:
#
# .env
#   ↓
# Docker
#   ↓
# variable de entorno
#   ↓
# Spring Boot
# =========================================================

mercadopago.access-token=${MP_ACCESS_TOKEN:}


# =========================================================
# TRANSFERENCIA
# =========================================================

transferencia.alias=${TRANSFERENCIA_ALIAS:}
transferencia.cbu=${TRANSFERENCIA_CBU:}
transferencia.titular=${TRANSFERENCIA_TITULAR:GRENLUS}


# =========================================================
# ARCHIVOS
# =========================================================

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================