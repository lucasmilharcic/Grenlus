spring.application.name=backend


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/grenlus
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# =========================================================
# JWT
# =========================================================

jwt.secret=GrenlusSuperSecretKeyForDevelopment123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ987654321abcdef
jwt.expiration=3600000


# =========================================================
# FRONTEND
# =========================================================

app.frontend-url=http://localhost:5173


# =========================================================
# BACKEND PUBLIC URL
#
# En desarrollo local queda vacío.
#
# Cuando publiques el backend:
#
# app.backend-public-url=https://api.tudominio.com
#
# Mercado Pago usará esa URL para webhooks.
# =========================================================

app.backend-public-url=${BACKEND_PUBLIC_URL:}


# =========================================================
# MERCADO PAGO
#
# El token real se obtiene desde una variable de entorno.
# No guardar credenciales reales en este archivo.
# =========================================================

mercadopago.access-token=${MP_ACCESS_TOKEN:}


# =========================================================
# TRANSFERENCIA
# =========================================================

transferencia.alias=${TRANSFERENCIA_ALIAS:}
transferencia.cbu=${TRANSFERENCIA_CBU:}
transferencia.titular=${TRANSFERENCIA_TITULAR:GRENLUS}


# =========================================================
# ARCHIVOS
# =========================================================

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================
# ZIPNOVA
#
# Las credenciales reales vienen desde .env -> Docker
# -> variables de entorno -> Spring Boot.
#
# No guardar API Key ni Secret directamente acá.
# =========================================================

zipnova.api-url=${ZIPNOVA_API_URL:https://api.zipnova.com.ar/v2}

zipnova.api-key=${ZIPNOVA_API_KEY:}

zipnova.api-secret=${ZIPNOVA_API_SECRET:}

zipnova.account-id=${ZIPNOVA_ACCOUNT_ID:0}

zipnova.origin-id=${ZIPNOVA_ORIGIN_ID:0}