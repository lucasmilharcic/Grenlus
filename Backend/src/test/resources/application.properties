# Use in-memory H2 for tests to avoid depending on local Postgres during unit test runs
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Disable external integrations during tests if needed
spring.main.allow-bean-definition-overriding=true

# JWT properties required by JwtTokenProvider
app.jwtSecret=changeit123456789012345678901234
app.jwtExpirationMs=3600000

# =========================================================
# ARCHIVOS
# =========================================================

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB


# =========================================================
# ZIPNOVA
# =========================================================

zipnova.api-url=${ZIPNOVA_API_URL:https://api.zipnova.com.ar/v2}
zipnova.api-key=${ZIPNOVA_API_KEY:}
zipnova.api-secret=${ZIPNOVA_API_SECRET:}
zipnova.account-id=${ZIPNOVA_ACCOUNT_ID:0}
zipnova.origin-id=${ZIPNOVA_ORIGIN_ID:0}